<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- token/bracket motif suggesting NLP tokenization -->
  <g fill="none" stroke="#2DD4BF" stroke-opacity="0.35" stroke-width="1.5">
    <rect x="870" y="60" width="58" height="30" rx="6"/>
    <rect x="938" y="60" width="42" height="30" rx="6"/>
    <rect x="990" y="60" width="70" height="30" rx="6"/>
    <rect x="870" y="100" width="34" height="30" rx="6"/>
    <rect x="914" y="100" width="66" height="30" rx="6"/>
    <rect x="990" y="100" width="50" height="30" rx="6"/>
  </g>
  <g fill="#2DD4BF" fill-opacity="0.55" font-family="monospace" font-size="13">
    <text x="882" y="80">I</text>
    <text x="950" y="80">am</text>
    <text x="1010" y="80">learning</text>
    <text x="878" y="120">NLP</text>
    <text x="932" y="120">models</text>
    <text x="1005" y="120">daily</text>
  </g>

  <!-- accent rule -->
  <rect x="70" y="96" width="64" height="6" rx="3" fill="url(#accent)"/>

  <text x="70" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F1F5F9">
    Saikiran Shriram
  </text>
  <text x="70" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#94A3B8">
    Aspiring AI/ML Engineer &#8226; NLP Track
  </text>

  <text x="70" y="225" font-family="monospace" font-size="14" fill="#5EEAD4">
    &gt; building systems that understand language_
  </text>
</svg>
