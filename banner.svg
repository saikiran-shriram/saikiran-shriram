<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#131B2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>

  <!-- token/bracket motif suggesting NLP tokenization -->
  <g font-family="monospace" font-size="13">
    <!-- row 1: I / am / learning -->
    <rect x="850" y="60" width="42" height="32" rx="6" fill="none" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="871" y="80.5" text-anchor="middle" fill="#5EEAD4">I</text>

    <rect x="902" y="60" width="52" height="32" rx="6" fill="none" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="928" y="80.5" text-anchor="middle" fill="#5EEAD4">am</text>

    <rect x="964" y="60" width="98" height="32" rx="6" fill="none" stroke="#2DD4BF" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1013" y="80.5" text-anchor="middle" fill="#5EEAD4">learning</text>

    <!-- row 2: NLP / models / daily -->
    <rect x="850" y="102" width="60" height="32" rx="6" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="880" y="122.5" text-anchor="middle" fill="#C4B5FD">NLP</text>

    <rect x="920" y="102" width="82" height="32" rx="6" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="961" y="122.5" text-anchor="middle" fill="#C4B5FD">models</text>

    <rect x="1012" y="102" width="70" height="32" rx="6" fill="none" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="1047" y="122.5" text-anchor="middle" fill="#C4B5FD">daily</text>
  </g>

  <!-- accent rule -->
  <rect x="70" y="96" width="64" height="6" rx="3" fill="url(#accent)"/>

  <text x="70" y="150" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#F1F5F9">
    Saikiran Shriram
  </text>
  <text x="70" y="190" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#94A3B8">
    Aspiring AI/ML Engineer &#8226; NLP Track
  </text>

  <text x="70" y="225" font-family="monospace" font-size="14" fill="#5EEAD4">
    &gt; building systems that understand language_
  </text>
</svg>
